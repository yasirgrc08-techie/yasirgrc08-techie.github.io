<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675" role="img"><style>@font-face{font-family:Lato;src:url('../fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../fonts/Lato-Bold.ttf');font-weight:700}text{font-family:Lato,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="540" height="675" fill="#f9fbfa" /><rect x="0" y="0" width="12" height="675" fill="#a14337" /><text x="32" y="30" font-size="9" fill="#a14337" font-weight="700">ENGINEERING / FIELD NOTES</text><text x="450" y="30" font-size="9" fill="#536a5d" font-weight="400">198 / 500</text><text x="32" y="74.0" font-size="27" fill="#20362e" font-weight="700">Cloud Cost per Useful Outcome</text><text x="32" y="133" font-size="10" fill="#a14337" font-weight="700">FAILURE AND RECOVERY</text><text x="32" y="154.5" font-size="11.5" fill="#536a5d" font-weight="400">A cheaper instance can produce a more expensive completed request.</text><line x1="32" y1="186" x2="508" y2="186" stroke="#cfdbd3" stroke-width="1" /><rect x="32" y="202" width="26" height="26" fill="#a14337" /><text x="38" y="220" font-size="10" fill="#ffffff" font-weight="700">01</text><line x1="45" y1="231" x2="45" y2="255" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="213.5" font-size="13.5" fill="#20362e" font-weight="700">Notice a cost spike</text><text x="73" y="232.5" font-size="10.5" fill="#465e51" font-weight="400">Spend rises without a proportional increase in useful customer outcomes.</text><rect x="32" y="260" width="26" height="26" fill="#a14337" /><text x="38" y="278" font-size="10" fill="#ffffff" font-weight="700">02</text><line x1="45" y1="289" x2="45" y2="313" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="271.5" font-size="13.5" fill="#20362e" font-weight="700">Break down the unit cost</text><text x="73" y="290.5" font-size="10.5" fill="#465e51" font-weight="400">Separate traffic growth from retries, retention changes, and idle resources.</text><rect x="32" y="318" width="26" height="26" fill="#a14337" /><text x="38" y="336" font-size="10" fill="#ffffff" font-weight="700">03</text><line x1="45" y1="347" x2="45" y2="371" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="329.5" font-size="13.5" fill="#20362e" font-weight="700">Contain waste safely</text><text x="73" y="348.5" font-size="10.5" fill="#465e51" font-weight="400">Stop unnecessary background work without deleting required data or recovery copies.</text><rect x="32" y="376" width="26" height="26" fill="#a14337" /><text x="38" y="394" font-size="10" fill="#ffffff" font-weight="700">04</text><line x1="45" y1="405" x2="45" y2="429" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="387.5" font-size="13.5" fill="#20362e" font-weight="700">Find the changed behavior</text><text x="73" y="406.5" font-size="10.5" fill="#465e51" font-weight="400">Compare deployments, query patterns, telemetry, and data-transfer paths.</text><rect x="32" y="434" width="26" height="26" fill="#a14337" /><text x="38" y="452" font-size="10" fill="#ffffff" font-weight="700">05</text><line x1="45" y1="463" x2="45" y2="487" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="445.5" font-size="13.5" fill="#20362e" font-weight="700">Validate the saving</text><text x="73" y="464.5" font-size="10.5" fill="#465e51" font-weight="400">Test the proposed change under equivalent performance and correctness conditions.</text><rect x="32" y="492" width="26" height="26" fill="#a14337" /><text x="38" y="510" font-size="10" fill="#ffffff" font-weight="700">06</text><text x="73" y="503.5" font-size="13.5" fill="#20362e" font-weight="700">Add ownership and alerts</text><text x="73" y="522.5" font-size="10.5" fill="#465e51" font-weight="400">Assign cost drivers to responsible services and monitor meaningful unit trends.</text><rect x="32" y="564" width="476" height="56" fill="#eaf0ec" /><text x="44" y="580" font-size="8" fill="#a14337" font-weight="700">THE TAKEAWAY</text><text x="44" y="598.5" font-size="10.5" fill="#20362e" font-weight="700">Optimize cost per correct, timely outcome rather than the smallest invoice line.</text><text x="32" y="648" font-size="10" fill="#20362e" font-weight="700">YASIR SHARFI</text><text x="175" y="648" font-size="7.3" fill="#536a5d" font-weight="400">MEASURE FIRST. MAKE TRADE-OFFS EXPLICIT.</text><text x="32" y="663" font-size="7.5" fill="#536a5d" font-weight="400">yasirgrc08-techie.github.io/blueprints</text><title>Cloud Cost per Useful Outcome / Failure and Recovery</title><desc>A cheaper instance can produce a more expensive completed request. Optimize cost per correct, timely outcome rather than the smallest invoice line.</desc></svg>