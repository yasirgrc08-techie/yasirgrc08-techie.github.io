<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675" role="img"><style>@font-face{font-family:Lato;src:url('../fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../fonts/Lato-Bold.ttf');font-weight:700}text{font-family:Lato,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="540" height="675" fill="#f9fbfa" /><rect x="0" y="0" width="12" height="675" fill="#6b4c87" /><text x="32" y="30" font-size="9" fill="#6b4c87" font-weight="700">ENGINEERING / FIELD NOTES</text><text x="450" y="30" font-size="9" fill="#536a5d" font-weight="400">024 / 500</text><text x="32" y="74.0" font-size="27" fill="#20362e" font-weight="700">Retries Without a Retry Storm</text><text x="32" y="133" font-size="10" fill="#6b4c87" font-weight="700">METRICS THAT MATTER</text><text x="32" y="154.5" font-size="11.5" fill="#536a5d" font-weight="400">Three retries at three layers can create far more than three extra requests.</text><line x1="32" y1="186" x2="508" y2="186" stroke="#cfdbd3" stroke-width="1" /><rect x="32" y="202" width="26" height="26" fill="#6b4c87" /><text x="38" y="220" font-size="10" fill="#ffffff" font-weight="700">01</text><line x1="45" y1="231" x2="45" y2="255" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="213.5" font-size="13.5" fill="#20362e" font-weight="700">Retry ratio</text><text x="73" y="232.5" font-size="10.5" fill="#465e51" font-weight="400">Measure retry attempts divided by original logical requests for each dependency.</text><rect x="32" y="260" width="26" height="26" fill="#6b4c87" /><text x="38" y="278" font-size="10" fill="#ffffff" font-weight="700">02</text><line x1="45" y1="289" x2="45" y2="313" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="271.5" font-size="13.5" fill="#20362e" font-weight="700">Interpret / Retry ratio</text><text x="73" y="290.5" font-size="10.5" fill="#465e51" font-weight="400">A healthy success rate can hide expensive retry amplification if you count only final outcomes.</text><rect x="32" y="318" width="26" height="26" fill="#6b4c87" /><text x="38" y="336" font-size="10" fill="#ffffff" font-weight="700">03</text><line x1="45" y1="347" x2="45" y2="371" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="329.5" font-size="13.5" fill="#20362e" font-weight="700">Budget exhaustion</text><text x="73" y="348.5" font-size="10.5" fill="#465e51" font-weight="400">Count operations that stop because attempts or deadlines are exhausted.</text><rect x="32" y="376" width="26" height="26" fill="#6b4c87" /><text x="38" y="394" font-size="10" fill="#ffffff" font-weight="700">04</text><line x1="45" y1="405" x2="45" y2="429" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="387.5" font-size="13.5" fill="#20362e" font-weight="700">Interpret / Budget exhaustion</text><text x="73" y="406.5" font-size="10.5" fill="#465e51" font-weight="400">Increasing every budget may increase user latency without improving successful completion.</text><rect x="32" y="434" width="26" height="26" fill="#6b4c87" /><text x="38" y="452" font-size="10" fill="#ffffff" font-weight="700">05</text><line x1="45" y1="463" x2="45" y2="487" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="445.5" font-size="13.5" fill="#20362e" font-weight="700">Recovery throughput</text><text x="73" y="464.5" font-size="10.5" fill="#465e51" font-weight="400">Track completed useful work as the dependency recovers.</text><rect x="32" y="492" width="26" height="26" fill="#6b4c87" /><text x="38" y="510" font-size="10" fill="#ffffff" font-weight="700">06</text><text x="73" y="503.5" font-size="13.5" fill="#20362e" font-weight="700">Interpret / Recovery throughput</text><text x="73" y="522.5" font-size="10.5" fill="#465e51" font-weight="400">Retry traffic can consume the capacity needed for new requests and recovery tasks.</text><rect x="32" y="564" width="476" height="56" fill="#eaf0ec" /><text x="44" y="580" font-size="8" fill="#6b4c87" font-weight="700">THE TAKEAWAY</text><text x="44" y="598.5" font-size="10.5" fill="#20362e" font-weight="700">A retry is new load. Spend it only when safety, time, and capacity all permit it.</text><text x="32" y="648" font-size="10" fill="#20362e" font-weight="700">YASIR SHARFI</text><text x="175" y="648" font-size="7.3" fill="#536a5d" font-weight="400">MEASURE FIRST. MAKE TRADE-OFFS EXPLICIT.</text><text x="32" y="663" font-size="7.5" fill="#536a5d" font-weight="400">yasirgrc08-techie.github.io/blueprints</text><title>Retries Without a Retry Storm / Metrics That Matter</title><desc>Three retries at three layers can create far more than three extra requests. A retry is new load. Spend it only when safety, time, and capacity all permit it.</desc></svg>