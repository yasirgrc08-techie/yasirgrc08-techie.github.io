<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675" role="img"><style>@font-face{font-family:Lato;src:url('../fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../fonts/Lato-Bold.ttf');font-weight:700}text{font-family:Lato,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="540" height="675" fill="#f9fbfa" /><rect x="0" y="0" width="12" height="675" fill="#a14337" /><text x="32" y="30" font-size="9" fill="#a14337" font-weight="700">ENGINEERING / FIELD NOTES</text><text x="450" y="30" font-size="9" fill="#536a5d" font-weight="400">398 / 500</text><text x="32" y="74.0" font-size="27" fill="#20362e" font-weight="700">Queues, Event Streams, and Reliable</text><text x="32" y="105.86" font-size="27" fill="#20362e" font-weight="700">Processing</text><text x="32" y="133" font-size="10" fill="#a14337" font-weight="700">PITFALLS AND CHECKS</text><text x="32" y="154.5" font-size="11.5" fill="#536a5d" font-weight="400">Does a message broker guarantee exactly-once business effects?</text><line x1="32" y1="186" x2="508" y2="186" stroke="#cfdbd3" stroke-width="1" /><rect x="32" y="202" width="26" height="26" fill="#a14337" /><text x="38" y="220" font-size="10" fill="#ffffff" font-weight="700">01</text><line x1="45" y1="231" x2="45" y2="255" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="213.5" font-size="13.5" fill="#20362e" font-weight="700">Trap 1</text><text x="73" y="232.5" font-size="10.5" fill="#465e51" font-weight="400">Acknowledging before the promised durable effect.</text><rect x="32" y="260" width="26" height="26" fill="#a14337" /><text x="38" y="278" font-size="10" fill="#ffffff" font-weight="700">02</text><line x1="45" y1="289" x2="45" y2="313" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="271.5" font-size="13.5" fill="#20362e" font-weight="700">Counter-check 1</text><text x="73" y="290.5" font-size="10.5" fill="#465e51" font-weight="400">Acknowledgement and effect boundaries are explicit.</text><rect x="32" y="318" width="26" height="26" fill="#a14337" /><text x="38" y="336" font-size="10" fill="#ffffff" font-weight="700">03</text><line x1="45" y1="347" x2="45" y2="371" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="329.5" font-size="13.5" fill="#20362e" font-weight="700">Trap 2</text><text x="73" y="348.5" font-size="10.5" fill="#465e51" font-weight="400">Treating an unbounded queue as a scaling strategy.</text><rect x="32" y="376" width="26" height="26" fill="#a14337" /><text x="38" y="394" font-size="10" fill="#ffffff" font-weight="700">04</text><line x1="45" y1="405" x2="45" y2="429" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="387.5" font-size="13.5" fill="#20362e" font-weight="700">Counter-check 2</text><text x="73" y="406.5" font-size="10.5" fill="#465e51" font-weight="400">Retries and poison messages have bounded behavior.</text><rect x="32" y="434" width="26" height="26" fill="#a14337" /><text x="38" y="452" font-size="10" fill="#ffffff" font-weight="700">05</text><line x1="45" y1="463" x2="45" y2="487" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="445.5" font-size="13.5" fill="#20362e" font-weight="700">Trap 3</text><text x="73" y="464.5" font-size="10.5" fill="#465e51" font-weight="400">Replaying events without versioning or duplicate-effect handling.</text><rect x="32" y="492" width="26" height="26" fill="#a14337" /><text x="38" y="510" font-size="10" fill="#ffffff" font-weight="700">06</text><text x="73" y="503.5" font-size="13.5" fill="#20362e" font-weight="700">Counter-check 3</text><text x="73" y="522.5" font-size="10.5" fill="#465e51" font-weight="400">Ordering scope and partition keys are justified.</text><rect x="32" y="564" width="476" height="56" fill="#eaf0ec" /><text x="44" y="580" font-size="8" fill="#a14337" font-weight="700">THE TAKEAWAY</text><text x="44" y="598.5" font-size="10.5" fill="#20362e" font-weight="700">Build a worker with a durable task ID and explicit states. Crash it at controlled points and replay</text><text x="44" y="610.89" font-size="10.5" fill="#20362e" font-weight="700">work.</text><text x="32" y="648" font-size="10" fill="#20362e" font-weight="700">YASIR SHARFI</text><text x="175" y="648" font-size="7.3" fill="#536a5d" font-weight="400">MEASURE FIRST. MAKE TRADE-OFFS EXPLICIT.</text><text x="32" y="663" font-size="7.5" fill="#536a5d" font-weight="400">yasirgrc08-techie.github.io/blueprints</text><title>Queues, Event Streams, and Reliable Processing / Pitfalls and Checks</title><desc>Does a message broker guarantee exactly-once business effects? Build a worker with a durable task ID and explicit states. Crash it at controlled points and replay work.</desc></svg>