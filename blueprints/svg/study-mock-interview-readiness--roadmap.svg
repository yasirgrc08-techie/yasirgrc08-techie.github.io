<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675" role="img"><style>@font-face{font-family:Lato;src:url('../fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../fonts/Lato-Bold.ttf');font-weight:700}text{font-family:Lato,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="540" height="675" fill="#f9fbfa" /><rect x="0" y="0" width="12" height="675" fill="#176b5b" /><text x="32" y="30" font-size="9" fill="#176b5b" font-weight="700">ENGINEERING / FIELD NOTES</text><text x="450" y="30" font-size="9" fill="#536a5d" font-weight="400">286 / 500</text><text x="32" y="74.0" font-size="27" fill="#20362e" font-weight="700">Run Better Mocks and Measure</text><text x="32" y="105.86" font-size="27" fill="#20362e" font-weight="700">Readiness</text><text x="32" y="133" font-size="10" fill="#176b5b" font-weight="700">LEARNING ROADMAP</text><text x="32" y="154.5" font-size="11.5" fill="#536a5d" font-weight="400">What score means I am ready?</text><line x1="32" y1="186" x2="508" y2="186" stroke="#cfdbd3" stroke-width="1" /><rect x="32" y="202" width="26" height="26" fill="#176b5b" /><text x="38" y="220" font-size="10" fill="#ffffff" font-weight="700">01</text><line x1="45" y1="231" x2="45" y2="255" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="213.5" font-size="13.5" fill="#20362e" font-weight="700">Build the mental model</text><text x="73" y="232.5" font-size="10.5" fill="#465e51" font-weight="400">Choose an unseen problem or change the constraints of a known one. Hide the pattern</text><text x="73" y="244.89" font-size="10.5" fill="#465e51" font-weight="400">category.</text><rect x="32" y="260" width="26" height="26" fill="#176b5b" /><text x="38" y="278" font-size="10" fill="#ffffff" font-weight="700">02</text><line x1="45" y1="289" x2="45" y2="313" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="271.5" font-size="13.5" fill="#20362e" font-weight="700">Phase 1 / Week 1</text><text x="73" y="290.5" font-size="10.5" fill="#465e51" font-weight="400">Run one coding mock and one role-relevant project or design discussion. Use the expected</text><text x="73" y="302.89" font-size="10.5" fill="#465e51" font-weight="400">tools, but do not assume one universal employer timing.</text><rect x="32" y="318" width="26" height="26" fill="#176b5b" /><text x="38" y="336" font-size="10" fill="#ffffff" font-weight="700">03</text><line x1="45" y1="347" x2="45" y2="371" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="329.5" font-size="13.5" fill="#20362e" font-weight="700">Phase 2 / Week 2</text><text x="73" y="348.5" font-size="10.5" fill="#465e51" font-weight="400">If recognition is weak, compare related patterns; if implementation is weak, rebuild small</text><text x="73" y="360.89" font-size="10.5" fill="#465e51" font-weight="400">primitives; if testing is weak, practice adversarial examples.</text><rect x="32" y="376" width="26" height="26" fill="#176b5b" /><text x="38" y="394" font-size="10" fill="#ffffff" font-weight="700">04</text><line x1="45" y1="405" x2="45" y2="429" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="387.5" font-size="13.5" fill="#20362e" font-weight="700">Phase 3 / Week 3</text><text x="73" y="406.5" font-size="10.5" fill="#465e51" font-weight="400">Run a mixed coding set and an architecture discussion with changing requirements. Ask the</text><text x="73" y="418.89" font-size="10.5" fill="#465e51" font-weight="400">reviewer to interrupt with a legitimate constraint or failing test.</text><rect x="32" y="434" width="26" height="26" fill="#176b5b" /><text x="38" y="452" font-size="10" fill="#ffffff" font-weight="700">05</text><line x1="45" y1="463" x2="45" y2="487" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="445.5" font-size="13.5" fill="#20362e" font-weight="700">Phase 4 / Week 4</text><text x="73" y="464.5" font-size="10.5" fill="#465e51" font-weight="400">Review recent sessions, not the best historical one. Keep strengths warm and revisit persistent</text><text x="73" y="476.89" font-size="10.5" fill="#465e51" font-weight="400">gaps. Confirm the actual interview scope and logistics.</text><rect x="32" y="492" width="26" height="26" fill="#176b5b" /><text x="38" y="510" font-size="10" fill="#ffffff" font-weight="700">06</text><text x="73" y="503.5" font-size="13.5" fill="#20362e" font-weight="700">Prove readiness</text><text x="73" y="522.5" font-size="10.5" fill="#465e51" font-weight="400">Recent mocks use unfamiliar tasks and recorded hints.</text><rect x="32" y="564" width="476" height="56" fill="#eaf0ec" /><text x="44" y="580" font-size="8" fill="#176b5b" font-weight="700">THE TAKEAWAY</text><text x="44" y="598.5" font-size="10.5" fill="#20362e" font-weight="700">Use one or two focused mocks weekly, leaving time for correction. Explain the rubric to the</text><text x="44" y="610.89" font-size="10.5" fill="#20362e" font-weight="700">reviewer beforehand.</text><text x="32" y="648" font-size="10" fill="#20362e" font-weight="700">YASIR SHARFI</text><text x="175" y="648" font-size="7.3" fill="#536a5d" font-weight="400">MEASURE FIRST. MAKE TRADE-OFFS EXPLICIT.</text><text x="32" y="663" font-size="7.5" fill="#536a5d" font-weight="400">yasirgrc08-techie.github.io/blueprints</text><title>Run Better Mocks and Measure Readiness / Learning Roadmap</title><desc>What score means I am ready? Use one or two focused mocks weekly, leaving time for correction. Explain the rubric to the reviewer beforehand.</desc></svg>