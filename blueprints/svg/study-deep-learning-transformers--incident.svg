<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675" role="img"><style>@font-face{font-family:Lato;src:url('../fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../fonts/Lato-Bold.ttf');font-weight:700}text{font-family:Lato,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="540" height="675" fill="#f9fbfa" /><rect x="0" y="0" width="12" height="675" fill="#a14337" /><text x="32" y="30" font-size="9" fill="#a14337" font-weight="700">ENGINEERING / FIELD NOTES</text><text x="450" y="30" font-size="9" fill="#536a5d" font-weight="400">458 / 500</text><text x="32" y="74.0" font-size="27" fill="#20362e" font-weight="700">Deep Learning and Transformers: A</text><text x="32" y="105.86" font-size="27" fill="#20362e" font-weight="700">Practical Map</text><text x="32" y="133" font-size="10" fill="#a14337" font-weight="700">PITFALLS AND CHECKS</text><text x="32" y="154.5" font-size="11.5" fill="#536a5d" font-weight="400">Does attention prove that a model understands a document?</text><line x1="32" y1="186" x2="508" y2="186" stroke="#cfdbd3" stroke-width="1" /><rect x="32" y="202" width="26" height="26" fill="#a14337" /><text x="38" y="220" font-size="10" fill="#ffffff" font-weight="700">01</text><line x1="45" y1="231" x2="45" y2="255" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="213.5" font-size="13.5" fill="#20362e" font-weight="700">Trap 1</text><text x="73" y="232.5" font-size="10.5" fill="#465e51" font-weight="400">Manipulating tensor shapes without tracking their meaning.</text><rect x="32" y="260" width="26" height="26" fill="#a14337" /><text x="38" y="278" font-size="10" fill="#ffffff" font-weight="700">02</text><line x1="45" y1="289" x2="45" y2="313" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="271.5" font-size="13.5" fill="#20362e" font-weight="700">Counter-check 1</text><text x="73" y="290.5" font-size="10.5" fill="#465e51" font-weight="400">A small training step and its gradient can be explained.</text><rect x="32" y="318" width="26" height="26" fill="#a14337" /><text x="38" y="336" font-size="10" fill="#ffffff" font-weight="700">03</text><line x1="45" y1="347" x2="45" y2="371" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="329.5" font-size="13.5" fill="#20362e" font-weight="700">Trap 2</text><text x="73" y="348.5" font-size="10.5" fill="#465e51" font-weight="400">Equating lower training loss with better real-world behavior.</text><rect x="32" y="376" width="26" height="26" fill="#a14337" /><text x="38" y="394" font-size="10" fill="#ffffff" font-weight="700">04</text><line x1="45" y1="405" x2="45" y2="429" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="387.5" font-size="13.5" fill="#20362e" font-weight="700">Counter-check 2</text><text x="73" y="406.5" font-size="10.5" fill="#465e51" font-weight="400">Data splits and model-selection boundaries are valid.</text><rect x="32" y="434" width="26" height="26" fill="#a14337" /><text x="38" y="452" font-size="10" fill="#ffffff" font-weight="700">05</text><line x1="45" y1="463" x2="45" y2="487" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="445.5" font-size="13.5" fill="#20362e" font-weight="700">Trap 3</text><text x="73" y="464.5" font-size="10.5" fill="#465e51" font-weight="400">Claiming context length or model size guarantees factual accuracy.</text><rect x="32" y="492" width="26" height="26" fill="#a14337" /><text x="38" y="510" font-size="10" fill="#ffffff" font-weight="700">06</text><text x="73" y="503.5" font-size="13.5" fill="#20362e" font-weight="700">Counter-check 3</text><text x="73" y="522.5" font-size="10.5" fill="#465e51" font-weight="400">Attention and masking are described operationally.</text><rect x="32" y="564" width="476" height="56" fill="#eaf0ec" /><text x="44" y="580" font-size="8" fill="#a14337" font-weight="700">THE TAKEAWAY</text><text x="44" y="598.5" font-size="10.5" fill="#20362e" font-weight="700">Use an established framework and small datasets. Inspect losses, shapes, gradients, and sample</text><text x="44" y="610.89" font-size="10.5" fill="#20362e" font-weight="700">predictions.</text><text x="32" y="648" font-size="10" fill="#20362e" font-weight="700">YASIR SHARFI</text><text x="175" y="648" font-size="7.3" fill="#536a5d" font-weight="400">MEASURE FIRST. MAKE TRADE-OFFS EXPLICIT.</text><text x="32" y="663" font-size="7.5" fill="#536a5d" font-weight="400">yasirgrc08-techie.github.io/blueprints</text><title>Deep Learning and Transformers: A Practical Map / Pitfalls and Checks</title><desc>Does attention prove that a model understands a document? Use an established framework and small datasets. Inspect losses, shapes, gradients, and sample predictions.</desc></svg>