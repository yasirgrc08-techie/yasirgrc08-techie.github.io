<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 540 675" role="img"><style>@font-face{font-family:Lato;src:url('../fonts/Lato-Regular.ttf')}@font-face{font-family:Lato;src:url('../fonts/Lato-Bold.ttf');font-weight:700}text{font-family:Lato,sans-serif;letter-spacing:0}</style><rect x="0" y="0" width="540" height="675" fill="#f9fbfa" /><rect x="0" y="0" width="12" height="675" fill="#245ca7" /><text x="32" y="30" font-size="9" fill="#245ca7" font-weight="700">ENGINEERING / FIELD NOTES</text><text x="450" y="30" font-size="9" fill="#536a5d" font-weight="400">017 / 500</text><text x="32" y="74.0" font-size="27" fill="#20362e" font-weight="700">Rate Limits That Protect Work</text><text x="32" y="133" font-size="10" fill="#245ca7" font-weight="700">DECISION GUIDE</text><text x="32" y="154.5" font-size="11.5" fill="#536a5d" font-weight="400">One cheap request and one expensive request should not always cost the same quota.</text><line x1="32" y1="186" x2="508" y2="186" stroke="#cfdbd3" stroke-width="1" /><rect x="32" y="202" width="26" height="26" fill="#245ca7" /><text x="38" y="220" font-size="10" fill="#ffffff" font-weight="700">01</text><line x1="45" y1="231" x2="45" y2="255" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="213.5" font-size="13.5" fill="#20362e" font-weight="700">Token bucket</text><text x="73" y="232.5" font-size="10.5" fill="#465e51" font-weight="400">Choose a token bucket when bounded bursts are useful and refill semantics can be explained</text><text x="73" y="244.89" font-size="10.5" fill="#465e51" font-weight="400">to clients.</text><rect x="32" y="260" width="26" height="26" fill="#245ca7" /><text x="38" y="278" font-size="10" fill="#ffffff" font-weight="700">02</text><line x1="45" y1="289" x2="45" y2="313" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="271.5" font-size="13.5" fill="#20362e" font-weight="700">Trade-off / Token bucket</text><text x="73" y="290.5" font-size="10.5" fill="#465e51" font-weight="400">A rate limit alone cannot cap the number of long-running requests already occupying</text><text x="73" y="302.89" font-size="10.5" fill="#465e51" font-weight="400">resources.</text><rect x="32" y="318" width="26" height="26" fill="#245ca7" /><text x="38" y="336" font-size="10" fill="#ffffff" font-weight="700">03</text><line x1="45" y1="347" x2="45" y2="371" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="329.5" font-size="13.5" fill="#20362e" font-weight="700">Concurrency limit</text><text x="73" y="348.5" font-size="10.5" fill="#465e51" font-weight="400">Choose an in-flight cap when work duration varies and active operations consume scarce</text><text x="73" y="360.89" font-size="10.5" fill="#465e51" font-weight="400">resources.</text><rect x="32" y="376" width="26" height="26" fill="#245ca7" /><text x="38" y="394" font-size="10" fill="#ffffff" font-weight="700">04</text><line x1="45" y1="405" x2="45" y2="429" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="387.5" font-size="13.5" fill="#20362e" font-weight="700">Trade-off / Concurrency limit</text><text x="73" y="406.5" font-size="10.5" fill="#465e51" font-weight="400">You need clear release behavior for cancellation, crashes, and timed-out requests.</text><rect x="32" y="434" width="26" height="26" fill="#245ca7" /><text x="38" y="452" font-size="10" fill="#ffffff" font-weight="700">05</text><line x1="45" y1="463" x2="45" y2="487" stroke="#c9d7cd" stroke-width="1" /><text x="73" y="445.5" font-size="13.5" fill="#20362e" font-weight="700">Shared quota service</text><text x="73" y="464.5" font-size="10.5" fill="#465e51" font-weight="400">Choose shared enforcement when multiple nodes must honor a common tenant budget.</text><rect x="32" y="492" width="26" height="26" fill="#245ca7" /><text x="38" y="510" font-size="10" fill="#ffffff" font-weight="700">06</text><text x="73" y="503.5" font-size="13.5" fill="#20362e" font-weight="700">Trade-off / Shared quota service</text><text x="73" y="522.5" font-size="10.5" fill="#465e51" font-weight="400">Coordination adds latency and failure modes; document approximation and regional behavior.</text><rect x="32" y="564" width="476" height="56" fill="#eaf0ec" /><text x="44" y="580" font-size="8" fill="#245ca7" font-weight="700">THE TAKEAWAY</text><text x="44" y="598.5" font-size="10.5" fill="#20362e" font-weight="700">Limit the scarce resource and preserve tenant fairness; request counts are only one</text><text x="44" y="610.89" font-size="10.5" fill="#20362e" font-weight="700">approximation.</text><text x="32" y="648" font-size="10" fill="#20362e" font-weight="700">YASIR SHARFI</text><text x="175" y="648" font-size="7.3" fill="#536a5d" font-weight="400">MEASURE FIRST. MAKE TRADE-OFFS EXPLICIT.</text><text x="32" y="663" font-size="7.5" fill="#536a5d" font-weight="400">yasirgrc08-techie.github.io/blueprints</text><title>Rate Limits That Protect Work / Decision Guide</title><desc>One cheap request and one expensive request should not always cost the same quota. Limit the scarce resource and preserve tenant fairness; request counts are only one approximation.</desc></svg>